name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest

      - name: Train
        run: python -m mlops_lab.train

      - name: Predict on sample
        run: python -m mlops_lab.predict --input examples/sample.csv

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: artifacts/
